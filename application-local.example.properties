# Copy to application-local.properties (excluded from Git)
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
app.jwt.secret=REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_BYTES_LONG
app.admin.password=SET_INITIAL_ADMIN_PASSWORD
# Optional email delivery (disabled by default)
app.notifications.email-enabled=false
app.notifications.from=campus@example.com
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=YOUR_SMTP_USERNAME
spring.mail.password=YOUR_SMTP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Optional SMS through Twilio (disabled by default)
app.notifications.sms-enabled=false
app.sms.account-sid=YOUR_ACCOUNT_SID
app.sms.auth-token=YOUR_AUTH_TOKEN
app.sms.from=YOUR_TWILIO_NUMBER
