spring.application.name=CSRM
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/csrm?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET:changeme-at-least-32-chars-long-secret}
app.admin.password=${ADMIN_PASSWORD:Campus@2026!}
spring.jackson.serialization.write-dates-as-timestamps=false

